# Publish the @suxeca bundles to npm on a dsh-v* tag push —
# mirroring the deepseek-harness release convention (release.yml):
# pack/build on every push, publication from a `dsh-v*` tag.
#
# Usage:
#   git tag dsh-v0.1.0-rc.1   # tag must match one package's version
#   git push origin dsh-v0.1.0-rc.1
#
# The tag version is matched against every package under packages/; the
# matching package (and only it) is built, tested, published to npm under
# `next` and promoted to `latest`. A tag that matches nothing runs the
# pipeline harmlessly (no publish steps fire).
#
# Prerequisite: an npmjs token with publish rights for the @suxeca scope
# stored as the repository secret `NPM_TOKEN`.
name: Publish to npm

on:
  push:
    tags:
      - 'dsh-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 手动发布（须处于 dsh-v* tag）
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish matching @suxeca package
    runs-on: ubuntu-latest
    steps:
      # Complete history: release scripts may read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          # pnpm 11 requires node:sqlite (Node ≥ 22.5); match the harness
          # release flow's primary Node version.
          node-version: 24
          # The publish step resolves credentials through this registry URL.
          registry-url: 'https://registry.npmjs.org'

      # The tag drives publication: a tag version equal to one package's
      # version publishes exactly that package.
      - name: Resolve package from tag
        id: resolve
        run: |
          TAG="${GITHUB_REF#refs/tags/dsh-v}"
          PKG=""
          HAS_TEST="0"
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            VERSION=$(node -p "require('./$dir/package.json').version" 2>/dev/null || true)
            [ "$VERSION" = "$TAG" ] || continue
            PKG=$(node -p "require('./$dir/package.json').name")
            HAS_TEST=$(node -p "require('./$dir/package.json').scripts && require('./$dir/package.json').scripts.test ? '1' : '0'")
            break
          done
          echo "tag=$TAG pkg=$PKG has_test=$HAS_TEST"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "has_test=$HAS_TEST" >> "$GITHUB_OUTPUT"

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.resolve.outputs.pkg != ''
        run: pnpm --filter "${{ steps.resolve.outputs.pkg }}" build

      - name: Test
        if: steps.resolve.outputs.pkg != '' && steps.resolve.outputs.has_test == '1'
        run: pnpm --filter "${{ steps.resolve.outputs.pkg }}" test

      # `prepublishOnly` rebuilds lib/ right before publishing; the tarball
      # then ships prebuilt code (see docs/develop/basic/publish).
      - name: Publish to npm
        if: steps.resolve.outputs.pkg != ''
        run: pnpm --filter "${{ steps.resolve.outputs.pkg }}" publish --no-git-checks --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keep `latest` in sync with every published rc, so a bare
      # `dsh plugin add @suxeca/<pkg>` always gets the newest fixed version
      # (npm leaves `latest` untouched for --tag publishes). The tag equals
      # the package version by construction of the resolve step.
      - name: Promote to latest
        if: steps.resolve.outputs.pkg != ''
        run: |
          PKG="${{ steps.resolve.outputs.pkg }}"
          TAG="${GITHUB_REF#refs/tags/dsh-v}"
          npm dist-tag add "${PKG}@${TAG}" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
