# dsh-client-ui-session-switcher bundle patch: inserts the plugin row into
# the web profile roster. Install with `dsh plugin --profile <name> add
# <path-or-git-url>`.
#
# Pure client plugin: the node half (exports ".") is an empty apply that only
# seats the package in the host Loader; the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: ui-session-switcher
      name: '@suxeca/dsh-client-ui-session-switcher'
