# dsh-plugin-manager bundle patch: one row mounting BOTH halves — the node
# half (exports ".") registers the /plugin-manager/* JSON routes, the
# pluginManager service and the /plugin human command; the `dsh.client`
# declaration in package.json makes the browser half (exports "./client")
# render the 插件管理 settings page.
#
# Install: `dsh plugin add @suxeca/dsh-plugin-manager` (or add the package to
# the web profile's bundles list manually), then restart dsh.
- insert:
    - id: plugin-manager
      name: '@suxeca/dsh-plugin-manager'
