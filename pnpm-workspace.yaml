packages:
  - 'packages/*'
  # dsh-quota-meter 未收录进公开仓库（源码内含 Antigravity 公开凭据，见 .gitignore），
  # 因此不得作为 workspace 成员出现在 lockfile 里，否则新克隆的 --frozen-lockfile 会失败。
  - '!packages/dsh-quota-meter'
  # dsh-secure-context-polyfill 同样是本机私人包（.gitignore 第 16 行），
  # 未收录进公开仓库，因此也不能出现在 lockfile 的 importer 列表里。
  - '!packages/dsh-secure-context-polyfill'
  #
  # 代价：在根目录跑 `pnpm install` 会剪掉这两个包专用的 store 条目，它们的
  # node_modules/@deepseek-ai/* 变成悬空链接，构建报 TS2307。本机要重建时用：
  #     scripts/relink-private-packages.sh --build
  # 它临时去掉上面两行排除、安装、再原样还原本文件与 `pnpm-lock.yaml`。
  # 不要改用 `cd packages/<pkg> && pnpm install` —— 独立安装无法解析
  # @deepseek-ai/* 的预发布版本（实测 ERR_PNPM_NO_MATCHING_VERSION）。

# pnpm store lives inside the workspace: the DSH file sandbox (workspace-write
# mode) only grants writes under the session workspace, and the default global
# store under ~/.local/share is read-only there.
storeDir: .pnpm-store

# Peer APIs (@deepseek-ai/dsh-*, cordis, react) resolve at runtime from the
# dsh profile tree, never from this repo's own install — matching the
# turtle-ui convention used by bundled plugins.
autoInstallPeers: false

allowBuilds:
  esbuild: true

# pnpm ≥10 refuses fresh rc packages below the minimum release age; the
# @deepseek-ai/* SDK surface ships as 0.1.0-rc.x, so every type-check
# dependency must be excluded from the age gate.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/dsh-agent-default-model@0.1.0-rc.6'
  - '@deepseek-ai/dsh-agent@0.1.0-rc.6'
